name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install -r apps/worker/requirements.txt
          pip install pip-audit
      - name: Audit Python dependencies
        run: |
          python -m pip_audit -r apps/api/requirements.txt -r apps/worker/requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest apps/api/tests apps/worker/tests -q

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: apps/frontend
        run: npm audit --audit-level=high
      - name: Typecheck and build
        working-directory: apps/frontend
        run: npm run check

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f docker/docker-compose.yml config
      - name: Build Docker images
        run: docker compose -f docker/docker-compose.yml build api worker clamav
      - name: Smoke-test non-root application imports
        run: |
          docker run --rm --entrypoint python mediaforge-api:local -c "import apps.api.app.main"
          docker run --rm --entrypoint python mediaforge-worker:local -c "import apps.worker.worker"
      - name: Smoke-test hardened Redis startup
        run: |
          cleanup() {
            docker compose -f docker/docker-compose.yml down --volumes
          }
          trap cleanup EXIT
          docker compose -f docker/docker-compose.yml up -d redis
          for attempt in $(seq 1 20); do
            if [ "$(docker compose -f docker/docker-compose.yml exec -T redis redis-cli ping 2>/dev/null)" = "PONG" ]; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f docker/docker-compose.yml logs redis
          exit 1

DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net
DNSDatabaseInfo current.cvd.clamav.net
ScriptedUpdates yes
TestDatabases yes
LogTime yes
Foreground yes
# The gateway starts clamd on demand. Its SelfCheck picks up database updates
# while it is warm; a cold start always loads the latest validated files.

# MediaForge accepts files up to 2 GiB. Limit hits and encrypted containers are
# treated as findings so that a file is never released only because it could not
# be inspected completely.
LogTime yes
LogClean yes
ExtendedDetectionInfo yes
PidFile /tmp/clamd.pid
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
OfficialDatabaseOnly yes

TCPSocket 3310
TCPAddr 0.0.0.0
LocalSocket /tmp/clamd.sock
LocalSocketMode 660
FixStaleSocket yes
StreamMaxLength 2048M
MaxConnectionQueueLength 20
MaxThreads 4
MaxQueue 20
ReadTimeout 330
CommandReadTimeout 30
SendBufTimeout 330

User clamav
Foreground yes

ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanSWF yes
ScanXMLDOCS yes
ScanHWP3 yes
ScanOneNote yes
ScanMail yes
ScanArchive yes

AlertEncrypted yes
AlertExceedsMax yes
MaxScanTime 300000
MaxScanSize 2048M
MaxFileSize 2048M
MaxRecursion 16
MaxFiles 10000

Bytecode yes
BytecodeSecurity TrustSigned
BytecodeUnsigned no
BytecodeTimeout 60000

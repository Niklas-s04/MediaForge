services:
  api:
    image: mediaforge-api:local
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: nas_convert_api
    mem_limit: ${API_MEMORY_LIMIT:-0}
    cpus: ${API_CPUS:-0}
    restart: unless-stopped
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8787}:8787"
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/db.sqlite3}
      - DATA_LOG_DIR=${DATA_LOG_DIR:-/data/logs}
      - DATA_UPLOAD_DIR=${DATA_UPLOAD_DIR:-/data/uploads}
      - DATA_OUTPUT_DIR=${DATA_OUTPUT_DIR:-/data/output}
      - MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES:-2147483648}
      - REMOTE_DOWNLOAD_MAX_BYTES=${REMOTE_DOWNLOAD_MAX_BYTES:-2147483648}
      - OUTPUT_RETENTION_HOURS=${OUTPUT_RETENTION_HOURS:-24}
      - OUTPUT_CLEANUP_INTERVAL_SECONDS=${OUTPUT_CLEANUP_INTERVAL_SECONDS:-3600}
      - MALWARE_SCAN_ENABLED=${MALWARE_SCAN_ENABLED:-true}
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - CLAMAV_TIMEOUT_SECONDS=${CLAMAV_TIMEOUT_SECONDS:-900}
      - CLAMAV_HEALTH_TIMEOUT_SECONDS=3
      - CLAMAV_RETRIES=${CLAMAV_RETRIES:-2}
      - MALWARE_SCAN_MAX_BYTES=${MALWARE_SCAN_MAX_BYTES:-2147483648}
    volumes:
      - ../data:/data
      - api-scratch:/scratch
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${API_TMPFS_SIZE:-64m},mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    init: true
    depends_on:
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks:
      - backend
      - scanner
      - egress

  worker:
    image: mediaforge-worker:local
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    container_name: nas_convert_worker
    mem_limit: ${WORKER_MEMORY_LIMIT:-0}
    cpus: ${WORKER_CPUS:-0}
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/db.sqlite3}
      - DATA_LOG_DIR=${DATA_LOG_DIR:-/data/logs}
      - DATA_UPLOAD_DIR=${DATA_UPLOAD_DIR:-/data/uploads}
      - DATA_OUTPUT_DIR=${DATA_OUTPUT_DIR:-/data/output}
      - REMOTE_DOWNLOAD_MAX_BYTES=${REMOTE_DOWNLOAD_MAX_BYTES:-2147483648}
      - OUTPUT_RETENTION_HOURS=${OUTPUT_RETENTION_HOURS:-24}
      - DOCUMENT_CONVERT_TIMEOUT_SECONDS=${DOCUMENT_CONVERT_TIMEOUT_SECONDS:-120}
      - MEDIA_CONVERT_TIMEOUT_SECONDS=${MEDIA_CONVERT_TIMEOUT_SECONDS:-21600}
      - MALWARE_SCAN_ENABLED=${MALWARE_SCAN_ENABLED:-true}
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - CLAMAV_TIMEOUT_SECONDS=${CLAMAV_TIMEOUT_SECONDS:-900}
      - CLAMAV_RETRIES=${CLAMAV_RETRIES:-2}
      - MALWARE_SCAN_MAX_BYTES=${MALWARE_SCAN_MAX_BYTES:-2147483648}
    command: ["celery", "-A", "apps.worker.worker:celery_app", "worker", "--loglevel=info", "--concurrency=${WORKER_CONCURRENCY:-1}", "--prefetch-multiplier=1", "--without-gossip", "--without-mingle"]
    volumes:
      - ../data:/data
      - worker-scratch:/scratch
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${WORKER_TMPFS_SIZE:-64m},mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    init: true
    depends_on:
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks:
      - backend
      - scanner
      - egress

  clamav:
    image: mediaforge-clamav:local
    build:
      context: clamav
      dockerfile: Dockerfile
    container_name: nas_convert_clamav
    restart: unless-stopped
    user: "clamav"
    environment:
      - CLAMAV_IDLE_SECONDS=${CLAMAV_IDLE_SECONDS:-60}
      - CLAMAV_STARTUP_SECONDS=${CLAMAV_STARTUP_SECONDS:-180}
      - CLAMAV_REQUEST_SECONDS=${CLAMAV_TIMEOUT_SECONDS:-900}
      - CLAMAV_MAX_BYTES=${MALWARE_SCAN_MAX_BYTES:-2147483648}
      - CLAMAV_DATABASE_MAX_AGE_SECONDS=${CLAMAV_DATABASE_MAX_AGE_SECONDS:-604800}
    init: true
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /var/log/clamav:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /run/clamav:rw,noexec,nosuid,nodev,size=16m,mode=1777
    volumes:
      - clamav-db:/var/lib/clamav
      - scanner-scratch:/scratch
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: ${CLAMAV_MEMORY_LIMIT:-3g}
    cpus: ${CLAMAV_CPUS:-2.0}
    networks:
      - scanner
      - egress

  redis:
    image: redis:7-alpine
    container_name: nas_convert_redis
    mem_limit: ${REDIS_MEMORY_LIMIT:-0}
    cpus: ${REDIS_CPUS:-0}
    restart: unless-stopped
    # The official entrypoint only switches users when started as root. Starting
    # as redis avoids requiring SETUID/SETGID capabilities with cap_drop: ALL.
    user: "redis"
    volumes:
      - redis-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - backend

volumes:
  redis-data:
  clamav-db:
  api-scratch:
  worker-scratch:
  scanner-scratch:

networks:
  backend:
    internal: true
  scanner:
    internal: true
  egress:

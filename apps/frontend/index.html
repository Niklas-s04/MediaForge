<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141715" />
    <script>
      const theme = window.matchMedia?.('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#141715' : '#f9f9f8';
    </script>
    <meta name="description" content="MediaForge – die Medienwerkstatt zum Herunterladen, Konvertieren und Komprimieren deiner Dateien." />
    <link rel="preload" href="/fonts/geist-400.ttf" as="font" type="font/ttf" crossorigin />
    <title>MediaForge</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
